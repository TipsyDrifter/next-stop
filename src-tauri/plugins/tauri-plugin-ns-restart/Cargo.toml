[package]
name = "tauri-plugin-ns-restart"
version = "0.1.0"
edition = "2021"
publish = false
description = "手機殼班 B5：Android 真重啟（前景重啟任務再結束行程；桌機照舊 app.restart()）"
# tauri-plugin 的 build 要求 links＝套件名（同 tauri-plugin-tt-notice）
links = "tauri-plugin-ns-restart"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
