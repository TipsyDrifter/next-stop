[package]
name = "next-stop"
version = "1.18.1"
description = "私鐵手帳 · 私鉄手帳 · Next Stop — 整合 7 大模塊於一處的個人生產力 App"
authors = ["主人 & 小紗"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "next_stop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`：時刻表 ①a 補充契約（D-時-24／25）桌機系統匣。tauri 只在桌機 target 拉 tray-icon crate，Android 開了也不多編東西。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# M3 ⑥ 備份三件套：
#  * sqlx ─ 備份快照用 `VACUUM INTO` 另開唯讀連線；還原時要拿 plugin-sql 的 `Pool<Sqlite>` 來 close()。
#           版本／features 必須與 tauri-plugin-sql 2.4.0 的 `sqlite` feature 一致（sqlx 0.8 + runtime-tokio），
#           否則會編出兩份 sqlx 型別。**不用 rusqlite**：它與 sqlx 各帶 libsqlite3-sys（`links = "sqlite3"` 只能有一份）。
#  * tauri-plugin-dialog ─ 第二備份位置選資料夾、「從檔案還原…」選 .db。
#  * chrono ─ 備份檔名要本地時間、created_at 要 UTC ISO；已在 Cargo.lock 內（serde_with 傳遞依賴），只是升為直接依賴。
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-dialog = "2"
# v1.1.4（契約 §6；WP-B）：Android「匯出到手機」走 SAF——JS 用 plugin-dialog 的 `save()` 讓主人自己選位置，
# 回來的是 `content://` URI，**`std::fs` 開不了**。plugin-fs 的 `Fs::open` 在 Android 會呼叫 ContentResolver
# 拿到 fd（`android.rs::resolve_content_uri`），桌機則直接走 `std::fs::OpenOptions`——同一支程式碼兩殼都寫得了。
# 已經是 tauri-plugin-dialog 的傳遞依賴（Cargo.lock 2.5.2），這裡只是升為直接依賴，不多一份樹。
# 只用 Rust 端的 `FsExt`，JS 那十幾支 fs command 一支都沒開（capabilities 不給 `fs:*` 權限）。
tauri-plugin-fs = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# v1.1.1 ⑦ 同步地基（契約 §5.4；**版本與契約草稿略有出入，理由都寫在這裡**）：
#  * object_store ─ Cloudflare R2 的 S3 API 客戶端（SigV4／分頁 list／重試都內建）。
#      **鎖 0.12 不升 0.14**：0.14 的 `aws` feature 硬綁 `aws-lc-rs`，而 `aws-lc-sys` 的 build.rs 要 cmake＋nasm，
#      本機兩樣都沒有、Android NDK 也編不過（實測 panic「NASM command not found」）。0.12 的 `cloud` 用 `ring`，
#      桌機與 aarch64-linux-android 都一次編過。`tls-webpki-roots`＝把根憑證編進來，不去讀系統憑證庫
#      （Android 的根憑證在 Java 那側，rustls-native-certs 讀不到）。代價＝多一份 reqwest 0.12 樹（tauri 用的是 0.13）。
#  * chacha20poly1305／argon2 ─ E2EE 的兩半：XChaCha20-Poly1305 封裝＋argon2id 派生（P2）。
#      0.11／0.6 是現行穩定版；API 換成 `hybrid-array`，建 cipher 走 `new_from_slice`（見 crypto.rs）。
#  * zstd ─ oplog 物件先壓再加密。帶 C（zstd-sys），**實測 NDK 28 的 clang 編得過**，所以不啟用 flate2 退路。
#  * base64 ─ 配對碼／金鑰／鹽的 base64url（無 padding）。釘 0.22＝lock 裡已有的版本，不多一份。
#  * getrandom ─ nonce 與 salt。**不用 `rand`**：rand 0.9／0.10 與 rand_core 正在換代，跟 chacha20poly1305 綁的
#      版本混起來會出現「兩份 OsRng 互不相容」的型別錯；我們只需要「填滿一段位元組」。
#  * uuid ─ device_id（v4）。v5 是 TS 端算 occurrences.id 用的，Rust 這輪不需要，就不開那個 feature。
#  * futures-util ─ object_store 的 list 回 `BoxStream`，要 `StreamExt::next()`。
object_store = { version = "0.12", features = ["aws", "tls-webpki-roots"] }
chacha20poly1305 = "0.11"
argon2 = "0.6"
zstd = "0.14"
base64 = "0.22"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# v1.1.5（契約 §4；契約席）：復原碼的 1 字元校驗碼＝SHA-256(原始 16B) 前 5 bits。
#   0.10.9 早已在 Cargo.lock（object_store／argon2 的傳遞依賴），這裡只是升為直接依賴，不多一份樹。
sha2 = "0.10"
# v1.1.5（契約 §3；WP-B）：OS 通知。只用 `notify` 一支（桌機點通知不回 App、Android 外掛 open issue 多，
#   橫幅才是主力）。lib.rs 兩殼都掛 `tauri_plugin_notification::init()`、capabilities 只給三／四條（不用 `:default` 的全開）。
#   **鎖 2.3**：npm 端 `@tauri-apps/plugin-notification` 同鎖 `~2.3.3`——tauri-cli 會擋 crate 與 npm 的 minor 不一致。
tauri-plugin-notification = "~2.3.3"
# 時刻表 ①c（接縫 #23，調度 2026-10-13 放行）：本地 plugin——Android 常駐通知的常用分類格、通知上換車／到着的待處理佇列、
#   跑太久提醒（自己的 AlarmManager＋開機重建）。Kotlin 只碰通知／鬧鐘／自己的 SharedPreferences，不寫 SQLite。
#   兩殼都掛；桌機是空殼（不註冊 Android 類別、沒有命令）。契約：docs/research/2026-10-13-時刻表-車次①b①c-契約.md §5.10。
tauri-plugin-tt-notice = { path = "plugins/tauri-plugin-tt-notice" }

# keyring 只在桌機：Android／iOS 沒有 OS 憑證庫後端，走 app 私有檔（sync/credstore.rs 的 cfg 兩分支）。
# **鎖 3 不升 4**：keyring 4 把各家後端拆成獨立 crate，`windows-native` 這個 feature 名字已經不存在。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# 時刻表 ①a 補充契約 §2-7：按 ✕ 改成縮到系統匣之後，主人從開始選單再開一次不能多開一個（兩個行程搶同一顆 DB）。
# 外掛本身只支援桌機（README 平台表 Android／iOS ✗、lib.rs 整支 `#![cfg(not(any(android, ios)))]`），所以只在這段拉。
# 沒有 npm 對應套件（純 Rust 端），不受 tauri-cli 的 crate／npm minor 一致檢查影響。
tauri-plugin-single-instance = "2"
# 旅客筆記⑤（契約 §3.4；查證 Q1／Q4）：全域鍵與開機自啟。兩個都只支援桌機（crate 整支 cfg(not(android, ios))）。
# 釘 ~2.3.2／~2.5.1：2.4.x／2.6.x 要 tauri ^2.12，lock 是 2.11.2（與 notification 鎖 ~2.3.3 同一個理由）。
# 沒有 npm 對應（只從 Rust 端用），不受 tauri-cli 的 crate／npm minor 一致檢查影響。
tauri-plugin-global-shortcut = "~2.3.2"
tauri-plugin-autostart = "~2.5.1"

# 旅客筆記⑤（契約 §0-0 / D-筆-61；主對話 M-6 已准）：存檔後把前景還給原本的 App，要 GetForegroundWindow／
# SetForegroundWindow。windows-sys 0.59.0 本來就在 Cargo.lock（間接依賴），這裡升為直接依賴、同版本，不多一棵樹；
# features 只開 Win32_Foundation（HWND）與 Win32_UI_WindowsAndMessaging（兩支函式）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }


# v1.1.2 QR 掃描（D-1.1-6 甲：手機掃桌機的 QR；契約席 2026-09-19 加、WP10a 接線）。
# 只掛在手機 target：桌機沒有相機、也不掃碼；掛上去桌機 build 只會多一份沒人叫的 plugin。
# Android 端會拉 ML Kit barcode-scanning（gradle 由 `tauri android build` 自動接 `:tauri-plugin-barcode-scanner`），
# 相機權限在 gen/android 的 AndroidManifest（CAMERA）＋ capabilities/mobile.json（barcode-scanner:allow-*）。
# 版本釘 2.4（與 npm `@tauri-apps/plugin-barcode-scanner` 2.4.x 同代）；3.0.0-alpha 是 tauri 3 用的，不上。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4"
